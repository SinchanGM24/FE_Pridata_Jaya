name: Build and publish staging Docker image

on:
  workflow_dispatch:
    inputs:
      next_public_api_url:
        description: "Override NEXT_PUBLIC_API_URL for this build"
        required: false
        type: string
  push:
    branches:
      - main
      - staging-dockerfile
      - feat/ci-ghcr-dokploy

permissions:
  contents: read
  packages: write

concurrency:
  group: fe-pridata-jaya-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/rizaldiabyannata/fe_pridata_jaya
  # Updated to new Dokploy BE domain (hash-based subdomain)
  DEFAULT_NEXT_PUBLIC_API_URL: http://pridata-be-staging-qmofvw-eec838-43-156-127-102.sslip.io/api/v1
  DEFAULT_NEXT_PUBLIC_APP_ENV: staging

jobs:
  docker:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "staging-dockerfile" ] || [ "${GITHUB_REF_NAME}" = "feat/ci-ghcr-dokploy" ]; then
            echo "tags=${IMAGE_NAME}:staging,${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve staging build config
        id: config
        shell: bash
        run: |
          API_URL="${{ github.event.inputs.next_public_api_url }}"
          if [ -z "$API_URL" ]; then API_URL="${{ vars.NEXT_PUBLIC_API_URL }}"; fi
          if [ -z "$API_URL" ]; then API_URL="$DEFAULT_NEXT_PUBLIC_API_URL"; fi
          APP_ENV="${{ vars.NEXT_PUBLIC_APP_ENV }}"
          if [ -z "$APP_ENV" ]; then APP_ENV="$DEFAULT_NEXT_PUBLIC_APP_ENV"; fi
          echo "next_public_api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "next_public_app_env=$APP_ENV" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.config.outputs.next_public_api_url }}
            NEXT_PUBLIC_APP_ENV=${{ steps.config.outputs.next_public_app_env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "NEXT_PUBLIC_API_URL: ${{ steps.config.outputs.next_public_api_url }}"
          echo "NEXT_PUBLIC_APP_ENV: ${{ steps.config.outputs.next_public_app_env }}"
          echo "Set GHCR package visibility to public after first push if needed."
