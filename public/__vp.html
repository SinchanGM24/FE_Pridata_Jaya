<!doctype html><meta charset=utf-8><title>vp</title>
<style>
 html,body{margin:0;background:#334155;font:12px system-ui}
 #wrap{display:flex;gap:16px;padding:12px;align-items:flex-start}
 .f{background:#fff;border:0;display:block}
 .lbl{color:#fff;font-weight:700;padding:2px 0}
</style>
<div id=wrap></div>
<script>
const p = new URLSearchParams(location.search);
const path = p.get('path') || '/toko/dashboard';
const sizes = (p.get('w') || '390').split(',').map(Number);
const h = Number(p.get('h') || 780);
document.getElementById('wrap').innerHTML = sizes.map(w =>
  `<div><div class=lbl>${w}px</div><iframe class=f id="f${w}" width="${w}" height="${h}" src="${path}"></iframe></div>`
).join('');
</script>
